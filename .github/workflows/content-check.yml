name: Content check
on:
  pull_request:
    paths-ignore:
      - "research/agent-audits/**"
      - "data/generated/radar.json"
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
