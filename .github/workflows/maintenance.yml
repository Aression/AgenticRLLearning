name: Knowledge maintenance
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch source metadata and arXiv discovery
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  issues: write
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Refresh sources
        if: github.event_name == 'schedule' || inputs.refresh
        run: python scripts/harness.py refresh
      - name: Run harness checks and report
        run: python scripts/harness.py report --json | tee harness-result.json
      - name: Build application
        run: npm ci && npm run build
      - name: Create maintenance issue when refresh changed evidence
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('harness-result.json', 'utf8');
            const body = `Automated weekly maintenance completed.\n\n\`\`\`json\n${result}\n\`\`\``;
            const label = 'maintenance';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '0e8a16', description: 'Automated knowledge maintenance' });
            }
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `Maintenance report ${new Date().toISOString().slice(0,10)}`, body, labels: [label] });
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-maintenance-report
          path: |
            research/source-audit.json
            research/discovery.json
            research/reports/
            harness-result.json
